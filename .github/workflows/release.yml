name: release

# Publishing is a separate workflow on purpose: it runs only on a tag, only
# from this repository, and only after the same gate a pull request gets.
#
# Authentication is PyPI Trusted Publishing (OIDC) -- there is no API token in
# this repository and no secret to rotate. Configure it once at
# https://pypi.org/manage/project/unwash-cli/settings/publishing/ with:
#   owner 0DukePan, repository unwash, workflow release.yml, environment pypi
#
# If the package did not exist on PyPI, the first release is authorised by a
# "pending publisher" entry created before the first upload; after 1.0.0 the
# Trusted Publisher on the project authorises every later one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check, do not upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip build twine
      - name: The tag and the declared version must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import unwash; print(unwash.__version__)")
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared" || {
            echo "::error::tag $GITHUB_REF_NAME does not match unwash.__version__ $declared"
            exit 1
          }
      - name: Build
        run: python -m build --outdir dist
      - name: Check the metadata
        run: python -m twine check dist/*
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    name: the gate a release must pass
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Offline measurements
        run: python benchmark/verify.py
      - name: The product gate
        run: python -m pytest -q -m "not program"
      - name: The built wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet dist/unwash_cli-*.whl
          /tmp/clean/bin/unwash --version
          /tmp/clean/bin/unwash doctor
      - name: The installed CLI catches the demo cheat
        run: |
          /tmp/clean/bin/python demo/run_demo.py --terse | tee /tmp/demo.txt
          grep -q "NOT_VERIFIED" /tmp/demo.txt
          grep -q "hardcoded-return" /tmp/demo.txt

  publish:
    name: upload to PyPI
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unwash-cli
    permissions:
      id-token: write
    steps:
      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        id: upload
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Explain a refused publisher
        if: steps.upload.outcome == 'failure'
        run: |
          cat <<'EOF'
          ::warning::PyPI refused the upload: no Trusted Publisher is configured for this project.

          This is not a code defect -- the wheel built and passed every gate. To finish it:

            1. https://pypi.org/manage/account/publishing/  (or the project's own Publishing page)
            2. PyPI Project Name: unwash-cli
               Owner:            0DukePan
               Repository:       unwash
               Workflow:         release.yml
               Environment:      pypi
            3. Re-run this job.

          Until then the supported install is:
            pipx install git+https://github.com/0DukePan/unwash@v1.0.0

          See RELEASING.md.
          EOF
          echo "### PyPI not configured -- see the warning above" >> "$GITHUB_STEP_SUMMARY"
          echo "The build and every gate passed; only the registry upload needs the publisher entry." >> "$GITHUB_STEP_SUMMARY"
          exit 1
